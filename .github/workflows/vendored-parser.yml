name: Vendored parser

# The entitlement-key reader under hyperformula/src/license/handsontable-license-key-parser/ is a verbatim
# copy of a private upstream directory. This job is the drift check that copy's integration guide
# asks for: it fails when any byte differs from the pinned tag, when a file shadows the copy, or
# when upstream has released a newer tag. See PROVENANCE.md in that directory.
#
# It needs LICENSE_KEY_REPO_TOKEN - a read-only token for handsontable/license-key - as a repository
# secret. Without it the check fails on purpose ("could not verify" is not "verified"), so this job
# stays red until the secret is set. Pull requests from forks never receive secrets and are skipped.

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - 'hyperformula/src/license/handsontable-license-key-parser/**'
      - 'hyperformula/script/check-license-key-parser-drift.js'
      - '.github/workflows/vendored-parser.yml'
  push:
    branches: [ master, develop ]
  schedule:
    - cron: '17 6 * * 1-5' # weekday mornings: a newer upstream tag is news even when nothing here changed

permissions:
  contents: read

jobs:
  drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Compare the vendored reader with upstream
        run: node hyperformula/script/check-license-key-parser-drift.js
        env:
          LICENSE_KEY_REPO_TOKEN: ${{ secrets.LICENSE_KEY_REPO_TOKEN }}
