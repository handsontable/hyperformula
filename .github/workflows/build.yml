name: Build on various envs
permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # the head branch is updated from the base branch, new commits are pushed to the head branch, or the base branch is changed
  push:
    branches:
      - 'master'
      - 'develop'
      - 'release/**'

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20, 22, 24 ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        install-command: [ i, ci ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@56899e050abffc08c2b3b61f3ec6a79a9dc3223d # https://github.com/actions/setup-node/releases/tag/v1.4.4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/checkout@722adc63f1aa60a57ec37892e133b1d319cae598 # https://github.com/actions/checkout/releases/tag/v2.0.0

      - name: Install dependencies
        run: npm ${{ matrix.install-command }}

      - name: Build
        run: npm run bundle-all

      - name: Verify no audit-harness markers leaked into build output
        shell: bash
        run: |
          # Fails the build if internal audit-harness citation markers ([V<n>])
          # or `§Sources` footers leak from spec drafts/comments into compiled output.
          # Markers belong only in internal docs/prompts, never in shipped JS.
          set -u
          paths=()
          for dir in dist commonjs es; do
            if [ -d "$dir" ]; then
              paths+=("$dir")
            fi
          done
          if [ ${#paths[@]} -eq 0 ]; then
            echo "No build output directories found (dist/, commonjs/, es/); skipping marker scan."
            exit 0
          fi
          echo "Scanning ${paths[*]} for audit-harness markers..."
          if grep -rnE '\[V[0-9]+\]|§[[:space:]]*Sources' "${paths[@]}"; then
            echo ""
            echo "ERROR: audit-harness markers ([V<n>] or §Sources) found in build output."
            echo "These markers are an internal spec-drafting convention and must never"
            echo "ship in compiled JS. Strip them from the source comments/strings above."
            exit 1
          fi
          echo "OK: no audit-harness markers found in build output."
