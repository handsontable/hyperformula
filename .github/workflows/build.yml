name: Build on various envs
permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # the head branch is updated from the base branch, new commits are pushed to the head branch, or the base branch is changed
  push:
    branches:
      - 'master'
      - 'develop'
      - 'release/**'

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20, 22, 24 ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        install-command: [ i, ci ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@56899e050abffc08c2b3b61f3ec6a79a9dc3223d # https://github.com/actions/setup-node/releases/tag/v1.4.4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/checkout@722adc63f1aa60a57ec37892e133b1d319cae598 # https://github.com/actions/checkout/releases/tag/v2.0.0

      - name: Install dependencies
        run: npm ${{ matrix.install-command }}

      - name: Build
        run: npm run bundle-all

      - name: Verify no audit-harness markers leaked into build output
        # Delegates to scripts/marker-scan.sh so the live CI scan and the
        # self-test below exercise the same code path and cannot drift.
        shell: bash
        run: bash scripts/marker-scan.sh dist commonjs es

      - name: Self-test marker-scan logic against synthetic fixtures
        # Run once per OS (the script is platform-agnostic and only takes <1s).
        # Validates that scripts/marker-scan.sh catches markers in dist/*.js,
        # dist/*.js.map (sourcesContent), commonjs/*.js, and es/*.mjs surfaces.
        if: matrix.node-version == 22 && matrix.install-command == 'ci'
        shell: bash
        run: bash scripts/test-marker-scan.sh
