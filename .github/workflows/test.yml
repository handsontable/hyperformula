name: Test
permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # the head branch is updated from the base branch, new commits are pushed to the head branch, or the base branch is changed
  push:
    branches:
      - 'master'
      - 'develop'
      - 'release/**'

jobs:
  unit-tests:
    strategy:
      matrix:
        node-version: [ '22' ]
        os: [ 'ubuntu-latest' ]
    name: unit-tests
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout hyperformula-tests repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_TOKEN }}
          repository: handsontable/hyperformula-tests
          path: hyperformula/test/hyperformula-tests

      - name: Fetch hyperformula-tests and sync branches
        run: cd hyperformula/test && ./fetch-tests.sh

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci -- --coverage


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  browser-tests:
    strategy:
      matrix:
        node-version: [ '22' ]
        os: [ 'ubuntu-latest' ]
    name: browser-tests
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout hyperformula-tests repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_TOKEN }}
          repository: handsontable/hyperformula-tests
          path: hyperformula/test/hyperformula-tests

      - name: Fetch hyperformula-tests and sync branches
        run: cd hyperformula/test && ./fetch-tests.sh

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:browser
