name: Performance
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # the head branch is updated from the base branch, new commits are pushed to the head branch, or the base branch is changed

jobs:
  performance-test:
    strategy:
      matrix:
        node-version: [ '22' ]
        os: [ 'ubuntu-latest' ]
    name: Test performance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # Base and head live side by side so their runs can alternate. Measuring one side
      # in a single block and the other afterwards lets the drift of a shared runner show up as a "regression";
      # alternating spreads that drift over both sides.
      - name: (base) Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: (head) Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head

      - name: Checkout hyperformula-tests repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_TOKEN }}
          repository: handsontable/hyperformula-tests
          path: head/hyperformula/test/hyperformula-tests

      - name: Fetch hyperformula-tests and sync branches
        run: cd head/hyperformula/test && ./fetch-tests.sh

      # Both sides run the same (head) copy of the suite; only the engine under test differs.
      - name: Share the tests between base and head
        run: cp -r head/hyperformula/test/hyperformula-tests base/hyperformula/test/hyperformula-tests

      - name: Record the revisions under test
        id: revisions
        run: |
          echo "base:  $(git -C base rev-parse HEAD)"
          echo "head:  $(git -C head rev-parse HEAD)"
          echo "tests: $(git -C head/hyperformula/test/hyperformula-tests rev-parse HEAD)"
          echo "tests=$(git -C head/hyperformula/test/hyperformula-tests rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: (base) Install dependencies
        run: cd base && npm ci

      - name: (head) Install dependencies
        run: cd head && npm ci

      # Two rounds, each with half of the samples; the comparison merges the rounds of a side. The order is
      # reversed in the second round (base, head, head, base) so that any effect of running first or second
      # is shared by both sides.
      - name: Run performance tests (alternating base and head)
        env:
          PERF_SAMPLE_SCALE: '0.5'
        run: |
          run() { (cd "$1" && npm run benchmark:write-to-file --workspace=hyperformula "$GITHUB_WORKSPACE/$1-$2.json"); }
          run base 1; run head 1
          run head 2; run base 2

      # Exits non-zero when a results file is unreadable or nothing is comparable, so a broken comparison is a
      # red check instead of a stale report. A regression is reported in the comment but does not fail this step.
      # When the tests carry a noise history, each scenario is judged against the band of changes measured
      # earlier on identical code.
      - name: Compare the results
        run: |
          HISTORY="$GITHUB_WORKSPACE/head/hyperformula/test/hyperformula-tests/performance/noise-history.json"
          if [ -f "$HISTORY" ]; then export PERF_HISTORY_FILE="$HISTORY"; fi
          cd head && npm run benchmark:compare-benchmarks --workspace=hyperformula "$GITHUB_WORKSPACE/base-1.json,$GITHUB_WORKSPACE/base-2.json" "$GITHUB_WORKSPACE/head-1.json,$GITHUB_WORKSPACE/head-2.json" "$GITHUB_WORKSPACE/performance-report.md"
          # A tests branch older than the two-round comparison reads the comma-separated list as one file name,
          # logs the error, exits 0 and writes no report. Fail here instead, so the failure comment below says so.
          test -s "$GITHUB_WORKSPACE/performance-report.md" || { echo "No performance report: merge develop of hyperformula-tests into the paired tests branch." >&2; exit 1; }

      # The runner is gone after the job; the raw samples in the log are what a later analysis can use.
      - name: Print the raw samples
        if: always()
        run: |
          for f in base-1 head-1 head-2 base-2; do
            echo "::group::$f.json"
            cat "$GITHUB_WORKSPACE/$f.json" 2>/dev/null || echo "(missing)"
            echo
            echo "::endgroup::"
          done

      - name: Publish a comment - header
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## Performance comparison of head (${{ github.event.pull_request.head.sha }}) vs base (${{ github.event.pull_request.base.sha }}) with the tests at ${{ steps.revisions.outputs.tests }}

      - name: Publish a comment - performance comparison report
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          append: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          path: performance-report.md

      # Replaces the previous push's table, so a failed run never leaves an older report standing for this head.
      - name: Publish a comment - failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## Performance comparison of head (${{ github.event.pull_request.head.sha }}) failed; see the job log.
