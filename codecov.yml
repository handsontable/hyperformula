codecov:
  require_ci_to_pass: yes

coverage:
  range: 95..100
  round: down
  precision: 2

# src/license/handsontable-license-key-parser/ is a byte-identical copy of handsontable/license-key's
# vendor/entitlement-key-reader (see PROVENANCE.md there). Upstream tests it; HyperFormula only calls
# part of it and may not edit it, so its coverage says nothing about this repository. It is left in the
# local jest report on purpose - only the codecov statuses ignore it.
ignore:
  - "src/license/handsontable-license-key-parser/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: new
  require_changes: false
  require_base: yes
  require_head: yes
